services:
  - type: web
    name: petexpertz-backend
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: petexpertz-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: petexpertz-db
    databaseName: petexpertz
    user: petexpertz
    region: singapore
    plan: free
