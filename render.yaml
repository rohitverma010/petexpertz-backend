services:
  - type: web
    name: petexpertz-backend
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # No DATABASE_URL set: the app falls back to a local SQLite file
      # (see database.py). Render's free plan only allows one free
      # Postgres DB per account; switch to Postgres by adding a
      # `databases:` block + DATABASE_URL here if that slot frees up,
      # or on a paid plan. Note: SQLite on Render's free web service
      # lives on ephemeral disk and resets on every redeploy.
      - key: PYTHON_VERSION
        value: 3.11.0
